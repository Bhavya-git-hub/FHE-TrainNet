# Demo Mode - sized to finish in roughly 1-3 minutes on a laptop.
#
# The depth budget is the point of this configuration. A degree-3 activation makes
# one training step cost 5 modulus levels, and this chain provides 10, so exactly
# two steps fit between refreshes. The fixed baseline is set to 1, which is safe
# but refreshes twice as often as necessary - which is what the adaptive policy
# is measured against.
#
# learning_rate is 0.3, not higher, and that is a measured choice. At 0.8 on this
# dataset the pre-activation value passes |z| = 2.82 by epoch 3, which is where the
# degree-3 polynomial stops increasing with its input. The gradient then inverts and
# accuracy falls from 0.94 to 0.10 without a single error being raised. The trainers
# now detect and report that condition; 0.3 stays inside the safe range throughout.
name: demo
dataset: iris_binary
n_samples: 100
test_fraction: 0.3
feature_range: 3.0
split_seed: 20260916

activation: sigmoid_deg3
learning_rate: 0.3
batch_size: 32
epochs: 6
init_scale: 0.1
model_seed: 20260916

poly_modulus_degree: 16384
coeff_mod_bit_sizes: [45, 35, 35, 35, 35, 35, 35, 35, 35, 35, 35, 40]
scale_bits: 35

baseline_interval: 1
adaptive_safety_margin: 0
adaptive_min_precision_bits: null

modes: [plaintext, fhe_baseline, fhe_adaptive]
trials: 1
measure_every: 1
use_canary: true
max_seconds_per_run: 900.0
notes: >-
  Default demonstration configuration. Two training steps fit between refreshes,
  so the fixed and adaptive policies make visibly different decisions.
